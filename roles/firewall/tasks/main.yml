---
- name: Ensure ufw installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default incoming deny
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Set default outgoing allow
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Allow SSH from LAN only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ssh_allow_lan_cidr }}"
  when: enable_ssh

- name: Allow mDNS from LAN (needed for pi-dean-dev.local resolution)
  community.general.ufw:
    rule: allow
    port: "5353"
    proto: udp
    from_ip: "{{ ssh_allow_lan_cidr }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

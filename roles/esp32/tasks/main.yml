---
# roles/esp32/tasks/main.yml
# ESP-IDF install using Espressif-supported scripts (install.sh + export.sh)
# with a shared tools directory via IDF_TOOLS_PATH.

- name: Install ESP-IDF prerequisites (Debian/Raspberry Pi OS)
  ansible.builtin.apt:
    name:
      - git
      - wget
      - flex
      - bison
      - gperf
      - python3
      - python3-pip
      - python3-venv
      - cmake
      - ninja-build
      - ccache
      - libffi-dev
      - libssl-dev
      - dfu-util
      - libusb-1.0-0
    state: present
    update_cache: true
  when: install_esp_idf

- name: Ensure ESP base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ esp_tools_dir }}"
    - "{{ esp_idf_dir }}"
  when: install_esp_idf

- name: Clone ESP-IDF (recursive) at pinned version
  ansible.builtin.git:
    repo: https://github.com/espressif/esp-idf.git
    dest: "{{ esp_idf_dir }}"
    version: "{{ esp_idf_version }}"
    recursive: true
    update: false
  when: install_esp_idf

# install.sh downloads toolchains + sets up the Python env as ESP-IDF expects.
# Run as root so tools land in {{ esp_tools_dir }}/tools (IDF_TOOLS_PATH)
# instead of a user's $HOME/.espressif.
- name: Run ESP-IDF tools installer (install.sh)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ esp_idf_dir }}"
    export IDF_TOOLS_PATH="{{ esp_tools_dir }}/tools"
    ./install.sh {{ esp_idf_targets | default('esp32') }}
  args:
    executable: /bin/bash
    creates: "{{ esp_tools_dir }}/tools/idf-env.json"
  when:
    - install_esp_idf
    - not ansible_check_mode

# Espressif recommends sourcing export.sh per-shell, not auto-activating it in
# every terminal session. export.sh only works when sourced (it must modify the
# caller's environment), so the helper refuses to run as a plain executable and
# a profile.d alias makes `get_idf` do the right thing in interactive shells.
- name: Install get_idf helper (must be sourced)
  ansible.builtin.copy:
    dest: /usr/local/bin/get_idf
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Usage: get_idf   (via the shell alias)  or:  . /usr/local/bin/get_idf
      if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
        echo "get_idf must be sourced to affect your shell: run '. get_idf'" >&2
        exit 1
      fi
      export IDF_PATH="{{ esp_idf_dir }}"
      export IDF_TOOLS_PATH="{{ esp_tools_dir }}/tools"
      # shellcheck disable=SC1090
      . "{{ esp_idf_dir }}/export.sh"
      echo "ESP-IDF environment loaded for this shell."
      echo "Tip: run 'idf.py --version' or 'idf.py set-target esp32' now."
  when: install_esp_idf

- name: Install get_idf shell alias (interactive shells)
  ansible.builtin.copy:
    dest: /etc/profile.d/esp-idf.sh
    mode: "0644"
    content: |
      alias get_idf='. /usr/local/bin/get_idf'
  when: install_esp_idf

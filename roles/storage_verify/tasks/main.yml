---
- name: Get root filesystem device
  ansible.builtin.command: findmnt -n -o SOURCE /
  register: storage_verify_root_dev
  changed_when: false

- name: Fail if root filesystem is not on NVMe
  ansible.builtin.fail:
    msg: >
      Root filesystem is not on NVMe.
      Detected: {{ storage_verify_root_dev.stdout }}
      Expected device name containing 'nvme'.
  when: "'nvme' not in storage_verify_root_dev.stdout"

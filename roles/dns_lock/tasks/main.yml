---
- name: Ensure chattr is available
  ansible.builtin.apt:
    name: e2fsprogs
    state: present

- name: Check for NetworkManager
  ansible.builtin.stat:
    path: /etc/NetworkManager
  register: dns_lock_nm_dir

- name: Stop NetworkManager from managing resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-dns-none.conf
    mode: "0644"
    content: |
      [main]
      dns=none
  when: dns_lock_nm_dir.stat.isdir | default(false)
  notify: Reload NetworkManager

- name: Check current resolv.conf state
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: dns_lock_resolv_stat

- name: Remove resolv.conf symlink (resolvconf/NetworkManager managed)
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: dns_lock_resolv_stat.stat.islnk | default(false)

- name: Check immutable flag on resolv.conf
  ansible.builtin.command: lsattr -d /etc/resolv.conf
  register: dns_lock_resolv_attrs
  failed_when: false
  changed_when: false

- name: Remove immutable flag before changes (safe re-run)
  ansible.builtin.command: chattr -i /etc/resolv.conf
  when: "'i' in (dns_lock_resolv_attrs.stdout | default('')).split() | first | default('')"
  changed_when: false

- name: Deploy resolv.conf with locked DNS
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

- name: Make resolv.conf immutable (prevents casual edits)
  ansible.builtin.command: chattr +i /etc/resolv.conf
  changed_when: "'i' not in (dns_lock_resolv_attrs.stdout | default('')).split() | first | default('')"
